<!DOCTYPE html>
<!--
  TEMPLATE - Spec interview round (HTML fallback path).

  Runtime use:
  1. Copy this file to spec-interview/<slug>/round-N.html.
  2. Set round and topic in collect().
  3. Replace QUESTIONS with the round's real questions.
     - multi: false renders radio buttons; multi: true renders checkboxes.
     - Options are [key, label, recommended(bool), short-reason].
     - Mark exactly one recommended option unless none is sensible.
     - Every question automatically gets an Other / note textarea.
  4. Keep copy/download logic intact. It emits
     { "round": N, "topic": "...", "answers": [{"id":"...","selected":[],"note":""}] }.

  The examples demonstrate both radio and checkbox questions. Replace them.
  This file is self-contained and works without a network connection.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spec Interview - Round 1 / Phase 3 screen sharing completion</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --card-2:#1f232c; --border:#2b303b;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#6ea8fe; --accent-soft:#2a3b57; --ok:#3ddc97; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; }
  .wrap { max-width:820px; margin:0 auto; padding:32px 20px 120px; }
  header h1 { font-size:1.5rem; margin:0 0 6px; }
  header p { color:var(--muted); margin:0 0 8px; }
  .hint { background:var(--accent-soft); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; font-size:.92rem; margin:18px 0 28px; }
  fieldset { border:1px solid var(--border); border-radius:12px; background:var(--card);
    margin:0 0 20px; padding:18px 20px; }
  legend { font-weight:600; padding:0 8px; font-size:1.02rem; }
  .domain { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin:-4px 0 12px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:9px 11px;
    border:1px solid transparent; border-radius:8px; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:var(--card-2); }
  .opt:focus-within { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px; }
  .opt input { margin-top:4px; accent-color:var(--accent); width:16px; height:16px; flex:none; }
  .rec { color:var(--ok); font-size:.78rem; font-weight:600; margin-left:6px; }
  .reason { color:var(--muted); }
  textarea { width:100%; margin-top:12px; background:var(--card-2); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:9px 11px; font:inherit; resize:vertical; min-height:44px; }
  textarea:focus, button:focus { outline:2px solid var(--accent); outline-offset:2px; }
  .note-label { font-size:.8rem; color:var(--muted); display:block; margin-top:12px; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:rgba(15,17,21,.92);
    backdrop-filter:blur(6px); border-top:1px solid var(--border); padding:14px 20px;
    display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; cursor:pointer; border-radius:9px; padding:11px 20px; border:1px solid var(--border); }
  .primary { background:var(--accent); color:#0b1020; border-color:var(--accent); }
  .primary:hover { filter:brightness(1.08); }
  .ghost { background:transparent; color:var(--text); }
  .ghost:hover { background:var(--card-2); }
  #status { color:var(--ok); font-size:.9rem; min-height:1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spec Interview - Round 1</h1>
    <p>Phase 3 screen sharing completion</p>
  </header>
  <div class="hint">
    Pick the option that fits best. <strong>Every question has a free-text field</strong>: use it to write your own answer, adjust the selected option, or explain. When done, click <strong>Copy answers</strong> and paste the block back into the chat.
  </div>
  <form id="form"></form>
  <div class="bar">
    <button type="button" class="primary" onclick="copyAnswers()">Copy answers</button>
    <button type="button" class="ghost" onclick="downloadAnswers()">Download answers.json</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</div>
<script>
// Replace this array with the real questions for this round.
const QUESTIONS = [
  { id: "q1", domain: "Objetivo e escopo", multi: false,
    title: "O que deve estar incluído para considerar a Fase 3 encerrada?",
    options: [
      ["A", "Corrigir a tela, preservar o áudio, cobrir regressões e concluir UAT real", true, "fecha o fluxo quebrado sem reabrir recursos já entregues"],
      ["B", "Somente corrigir o sintoma visual do palco", false, "menor escopo, mas pode deixar a causa e a entrega P2P incompletas"],
      ["C", "Reauditar e retrabalhar toda a Fase 3", false, "aumenta muito o escopo e repete trabalho já verificado"]
    ] },
  { id: "q2", domain: "Experiência do usuário", multi: false,
    title: "Quem deve ver o palco integrado durante um compartilhamento bem-sucedido?",
    options: [
      ["A", "Presenter e todos os viewers elegíveis", true, "o presenter confirma imediatamente o que está sendo enviado"],
      ["B", "Somente os viewers", false, "economiza espaço local, mas reduz a confirmação visual do presenter"],
      ["C", "Presenter vê apenas um indicador; viewers veem o palco", false, "mantém confirmação parcial com uma interface diferente"]
    ] },
  { id: "q3", domain: "Critério de sucesso", multi: false,
    title: "Qual tempo máximo aceitável entre escolher a fonte e ver um palco estável?",
    options: [
      ["A", "Até 5 segundos", true, "permite negociação P2P sem parecer que o clique falhou"],
      ["B", "Até 2 segundos", false, "mais responsivo, mas pode falhar em redes e máquinas comuns"],
      ["C", "Até 10 segundos com progresso visível", false, "mais tolerante, mas prolonga a espera do usuário"]
    ] },
  { id: "q4", domain: "Falhas e recuperação", multi: false,
    title: "Se a captura abrir, mas claim, autoridade ou signaling falhar, qual comportamento é obrigatório?",
    options: [
      ["A", "Parar somente a tela, manter o áudio e mostrar erro acionável persistente", true, "evita falha silenciosa e preserva a conversa"],
      ["B", "Tentar novamente automaticamente e mostrar erro somente depois", false, "pode recuperar falhas transitórias, mas prolonga captura sem confirmação"],
      ["C", "Parar tela e áudio e pedir reentrada na sala", false, "simplifica recuperação, mas quebra o requisito de preservar áudio"]
    ] },
  { id: "q5", domain: "Plataformas", multi: false,
    title: "Qual suporte de navegador deve ser obrigatório para encerrar esta Fase 3?",
    options: [
      ["A", "Chrome e Edge atuais no desktop Windows", true, "cobre o ambiente reproduzido sem criar uma matriz ampla"],
      ["B", "Somente Chromium atual no ambiente de teste", false, "menor custo, mas não promete paridade entre Chrome e Edge"],
      ["C", "Chrome, Edge, Firefox e Safari atuais", false, "maior cobertura, mas amplia muito testes e diferenças WebRTC"]
    ] },
  { id: "q6", domain: "Ambiente de validação", multi: false,
    title: "Qual evidência real deve ser obrigatória para aprovar o compartilhamento P2P?",
    options: [
      ["A", "Duas contas reais em contextos isolados no mesmo computador", true, "reproduz exatamente o fluxo atual sem equipamento adicional"],
      ["B", "Duas contas em dois computadores na mesma rede", false, "valida dois dispositivos, mas exige equipamento adicional"],
      ["C", "Duas contas em redes diferentes", false, "testa travessia de rede, mas pode exigir TURN e ampliar o escopo"]
    ] },
  { id: "q7", domain: "Banco e rollout", multi: false,
    title: "Em qual ambiente a UAT final deve provar o fluxo?",
    options: [
      ["A", "Aplicativo local ligado ao projeto Supabase de produção já autorizado anteriormente", true, "repete a evidência anterior sem implantar a aplicação"],
      ["B", "Somente ambiente local com mocks ou fixture", false, "é seguro, mas não prova Realtime, RLS ou P2P reais"],
      ["C", "Aplicação implantada em produção", false, "prova o rollout final, mas autoriza uma mudança operacional maior"]
    ] },
  { id: "q8", domain: "Estratégia de teste", multi: false,
    title: "Qual gate técnico deve acompanhar a correção?",
    options: [
      ["A", "Reprodução primeiro, teste de regressão, testes focados, type-check, lint, build e UAT real", true, "liga a causa raiz a evidência automática e humana"],
      ["B", "Testes focados e UAT real", false, "reduz tempo, mas deixa integrações e build menos protegidos"],
      ["C", "Somente UAT real", false, "prova o sintoma, mas não protege contra regressão futura"]
    ] },
  { id: "q9", domain: "Restrições", multi: true,
    title: "Quais resultados nunca podem ocorrer durante a correção? Marque todos que se aplicam.",
    options: [
      ["A", "O áudio parar ou reiniciar por causa da tela", true, "preserva o principal fluxo já funcional"],
      ["B", "Duas telas canônicas simultâneas na mesma sala", false, "viola a regra de presenter único"],
      ["C", "Captura sem indicador, erro ou caminho claro para parar", false, "deixa o usuário sem controle sobre a mídia"],
      ["D", "Persistir, gravar, transcrever ou republicar a mídia", false, "amplia privacidade e escopo sem autorização"],
      ["E", "Uma sessão ou sala antiga manter palco ou sender ativo", false, "cria vazamento entre escopos e estado obsoleto"]
    ] },
  { id: "q10", domain: "Artefatos e transição", multi: false,
    title: "Como devemos tratar os documentos antigos da Fase 3 em .planning após a entrega?",
    options: [
      ["A", "Preservar o histórico e corrigir somente estados ou afirmações que ficarem factualmente obsoletos", true, "mantém rastreabilidade sem continuar o workflow GSD"],
      ["B", "Não alterar nada em .planning", false, "isola o novo workflow, mas pode deixar status contraditório"],
      ["C", "Migrar toda a Fase 3 para o novo workflow", false, "unifica documentos, mas cria trabalho documental amplo e repetitivo"]
    ] }
];

const form = document.getElementById("form");
QUESTIONS.forEach((q, i) => {
  const fs = document.createElement("fieldset");
  const type = q.multi ? "checkbox" : "radio";
  let html = `<legend>${i + 1}. ${q.title}</legend>`;
  html += `<div class="domain">${q.domain}${q.multi ? " / multiple choice" : ""}</div>`;
  q.options.forEach(([key, label, rec, reason]) => {
    html += `<label class="opt"><input type="${type}" name="${q.id}" value="${key}">
      <span><b>${key}.</b> ${label}${rec ? '<span class="rec">(Recommended)</span>' : ""}
      ${reason ? ` - <span class="reason">${reason}</span>` : ""}</span></label>`;
  });
  html += `<label class="note-label" for="${q.id}-note">Other / note (write your own answer):</label>
    <textarea id="${q.id}-note" placeholder="Write here if no option fits, or to add detail..."></textarea>`;
  fs.innerHTML = html;
  form.appendChild(fs);
});

function collect() {
  return {
    round: 1,          // set this round's number
    topic: "phase-3-screen-sharing-completion", // set a short slug for this spec
    answers: QUESTIONS.map(q => ({
      id: q.id,
      selected: [...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(el => el.value),
      note: document.getElementById(`${q.id}-note`).value.trim()
    }))
  };
}
function copyAnswers() {
  const data = JSON.stringify(collect(), null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(data).then(
      () => setStatus("Copied! Paste the block into the chat."),
      () => fallbackCopy(data)
    );
  } else {
    fallbackCopy(data);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); setStatus("Copied! Paste the block into the chat."); }
  catch (e) { setStatus("Couldn't copy - use Download answers.json."); }
  document.body.removeChild(ta);
}
function downloadAnswers() {
  const r = collect().round;
  const blob = new Blob([JSON.stringify(collect(), null, 2)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `answers-round-${r}.json`; a.click(); URL.revokeObjectURL(a.href);
  setStatus("Downloaded answers file.");
}
function setStatus(msg) { document.getElementById("status").textContent = msg; }
</script>
</body>
</html>
